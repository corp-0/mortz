format_version = 1
name = "Team Deathmatch"
description = "Two teams. First team to the kill target wins."
identity = ["rules.teams", "rules.score", "rules.winner", "rules.evaluation", "rules.replay", "rules.end_condition.type", "rules.objective.type", "rules.respawn.type"]

[rules]
score = "kills"
winner = "highest_score"
evaluation = "elimination"
replay = "decisive_elimination"
teams = true
suicide_penalty = "reward_closest_enemy"

[rules.end_condition]
type = "score_target"
target = 15
